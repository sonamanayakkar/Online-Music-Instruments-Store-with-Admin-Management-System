<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style/index.css">
</head>

<body>


    <section>

        <div class="container1">
            <form action="" >

                <div class="box">
                    <h3>Welcome to MusicMart</h3>
                </div>
                <div class="box">
                   
                    <p>Login to your account to see and choose your favorite musical instrument from String</p>
                </div>
                <div class="box">
                    <label for="">Email</label>
                    <input type="email" placeholder="Enter your mail" id="email">
                    <span class="error"></span>
                </div>
                <div class="box">
                    <label for="">Password</label>
                    <input type="password" placeholder="Enter your password" id="password">
                    <span class="error"></span>
                </div>
                <div class="box">
                    <Button type="submit">Login</Button>
                </div>
                <div class="box box6">
                    <h4>Don't have an account <a href="website/registration.html" class="reglocation"> Register here</a></h4>
                    <h4>Admin ?<a href="admin/adminlogin.html"> Login here</a></h4>
                </div>
                <div class="box">

                </div>

            </form>
        </div>

    </section>

<script src="website/script/login.js"></script>

</body>

</html>
