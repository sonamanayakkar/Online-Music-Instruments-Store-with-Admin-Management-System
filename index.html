<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Registration</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="shortcut icon" href="images/logo/3d-render-music-note-illustration-design.jpg" type="image/x-icon">
</head>

<body>


    <section>

        <div class="container1">
            <form action="">

                <div class="box">
                    <h3>Welcome to Rhythmix</h3>
                </div>
                <div class="box">

                    <p>Login to your account to see and choose your favorite musical instrument from String</p>
                </div>
                <div class="box">
                    <label for="">Email</label>
                    <input type="email" placeholder="Enter your mail" id="email">
                    <span class="error"></span>
                </div>
                <div class="box password">
                    <label for="">Password</label>
                    <div class="input">
                        <input type="password" placeholder="Enter your password" id="password" class="">
                        <i class="fa-solid fa-eye-slash eye" id="closeeye" style="display: none;"></i>
                        <i class="fa-solid fa-eye eye" id="openeye"></i></i>
                    </div>
                    <span class="error"></span>
                </div>
                <div class="box">
                    <Button type="submit">Login</Button>
                </div>
                <div class="box box6">
                    <h4>Don't have an account <a href="website/registration.html" class="reglocation"> Register here</a>
                    </h4>
                    <h4>Admin ?<a href="admin/adminlogin.html"> Login here</a></h4>
                </div>
                <div class="box">

                </div>

            </form>
        </div>

    </section>

    <script src="website/script/login.js"></script>

</body>

</html>
