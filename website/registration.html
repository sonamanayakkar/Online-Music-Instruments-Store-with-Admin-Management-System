<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="../style/index.css">
</head>

<body>


    <section>

        <div class="container1">
            <form action="">

                <div class="box">
                    <h2>Register here</h2>
                   
                </div>
                <div class="box">
                    <label for="">User Name</label>
                    <input type="text" placeholder="Enter your Name" id="name">
                    <span class="error"></span>
                </div>
                <div class="box">
                    <label for="">Email</label>
                    <input type="email" placeholder="Enter your mail" id="email">
                    <span class="error"></span>
                </div>
                <div class="box">
                    <label for="">Password</label>
                    <input type="password" placeholder="Enter your password" id="password">
                    <span class="error"></span>
                </div>
                <div class="box">
                    <label for="">Confirm Password</label>
                    <input type="text" placeholder="Enter your password" id="confirmpassword">
                    <span class="error"></span>
                </div>
                <div class="box">
                    <a href="../index.html"><button type="submit" id="register">Register</button></a>
                </div>
                <div class="box box6">
                    <h4>Already have an account <a href="../index.html">Login here</a></h4>
                    <h4>Admin ?<a href=""> Login here</a></h4>
                </div>
                

            </form>
        </div>

    </section>


<script src="script/registration.js"></script>
</body>

</html>
